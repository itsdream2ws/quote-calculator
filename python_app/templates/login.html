<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Quote Calculator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
<form class="login-card" method="post">
  <h1>Quote Calculator</h1>
  <p>Log in with your agent code and password. You need internet for the first log in; after that the app works offline too.</p>
  {% for kind, text in get_flashed_messages(with_categories=true) %}<div class="login-msg {{ kind }}">{{ text }}</div>{% endfor %}
  <label>Agent code<input name="agent" value="{{ code }}" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. AG01" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
</form>
</body>
</html>
